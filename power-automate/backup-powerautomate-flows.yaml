name: Power Automate backup
on:
  schedule: [{ cron: "0 4 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Export all flows
        run: bash backup-flows.sh
        env:
          PA_APPLICATION_ID: ${{ secrets.PA_APPLICATION_ID }}
          PA_CLIENT_SECRET: ${{ secrets.PA_CLIENT_SECRET }}
          PA_TENANT_ID: ${{ secrets.PA_TENANT_ID }}
          PA_ENVIRONMENTS: ${{ vars.PA_ENVIRONMENTS }}
      - name: Commit
        if: always()
        run: |
          git config user.name "pa-backup-bot"
          git config user.email "pa-backup-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Power Automate backup $(date -u +%F)"
          git push
      - name: Alert
        if: failure() || hashFiles('flows/_unreadable.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Power Automate backup needs attention"
          open=$(gh issue list --repo ${{ github.repository }} --state open \
                   --search "in:title \"$title\"" --json number -q '.[].number')
          if [ -n "$open" ]; then echo "Issue #$open is already open; not creating another."; exit 0; fi
          body="Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -f flows/_unreadable.txt ]; then
            body="$body"$'\n\nFlows not backed up (environment | flow | reason):\n'"$(cat flows/_unreadable.txt)"
          fi
          gh issue create --repo ${{ github.repository }} --title "$title" --body "$body" --assignee alice,bob
